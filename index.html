<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Linha Fixa</title>
    <meta name="theme-color" content="#0f172a" />
    <!-- iOS standalone (PWA) — improves the full-screen experience on iPhone. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Linha Fixa" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230f172a'/%3E%3Cpath d='M20 50h60' stroke='%233b82f6' stroke-width='8' stroke-linecap='round'/%3E%3Ccircle cx='50' cy='50' r='10' fill='%23ef4444'/%3E%3C/svg%3E" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <!-- Anti-flash: aplica .dark antes do bundle carregar. A chave duplica a
         THEME_STORAGE_KEY de src/services/theme.ts de propósito — este script
         roda antes de qualquer módulo existir. -->
    <script>
      try {
        var t = localStorage.getItem('linhafixa_theme');
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
